server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Service worker ve manifest önbelleğe alınmamalı (güncellemeler için)
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    # index.html asla önbelleğe alınmamalı; yoksa eski JS hash'ine işaret eder
    # ve yeni deploy gelmez. Hash'li /assets/ dosyaları immutable kalabilir.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # PocketBase'i same-origin /pb altında proxy'le → CORS yok, IP yazmaya gerek yok.
    # /pb/api/... → pocketbase:8090/api/... ; admin UI /pb/_/ ; AI proxy /pb/ai
    location /pb/ {
        proxy_pass http://pocketbase:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;          # fiş/ekstre görselleri (base64) için
        # PocketBase realtime (SSE) akışı tamponlanmamalı
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # SPA: bilinmeyen yolları index.html'e yönlendir
    location / {
        try_files $uri $uri/ /index.html;
    }

    # .mjs (ES modülü, ör. pdf.js worker) doğru MIME ile sunulmalı;
    # yoksa tarayıcı modül worker'ı reddeder (octet-stream) → PDF okunamaz
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Statik varlıkları uzun süre önbelleğe al
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
