name: finansapp

services:
  finansapp:
    build: .
    image: ghcr.io/coosef/finansapp-pro:latest
    container_name: finansapp
    depends_on:
      - pocketbase
    ports:
      - "8080:80"
    environment:
      - TZ=${TZ:-Europe/Istanbul}
    restart: unless-stopped

  # DB + auth + senkron backend. Hook/migration imaja gömülü; veri /pb_data'da kalıcı.
  # PocketBase dışarı port AÇMAZ — nginx same-origin /pb altında proxy'ler.
  pocketbase:
    build: ./pb
    image: ghcr.io/coosef/finansapp-pb:latest
    container_name: finansapp-pb
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Istanbul}
      # AI proxy için (opsiyonel). Boşsa AI çağrıları 503 döner; app yine çalışır.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    # CasaOS uyumu için bind mount (isimli volume CasaOS editöründe "[object Object]"
    # hatası veriyor). Düz Docker'da istersen ./pb_data yapabilirsin.
    volumes:
      - /DATA/AppData/finansapp/pb_data:/pb_data
    command:
      - serve
      - --http=0.0.0.0:8090
      - --dir=/pb_data
      - --migrationsDir=/pb_migrations
      - --hooksDir=/pb_hooks
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

# ---- CasaOS App Store meta verisi ----
x-casaos:
  architectures:
    - amd64
    - arm64
  main: finansapp
  author: Coosef
  developer: Coosef
  category: Finance
  port_map: "8080"
  scheme: http
  index: /
  title:
    en_us: FinansApp Pro
    tr_tr: FinansApp Pro
  tagline:
    en_us: Self-hosted Turkish personal finance manager
    tr_tr: Kendi sunucunda Türkçe kişisel finans yönetimi
  description:
    en_us: Track income/expenses, budgets, investments, statements (OCR) and get AI insights. Data stays on your server (PocketBase).
    tr_tr: Gelir/gider, bütçe, yatırım, ekstre (OCR) takibi ve AI içgörüleri. Veri kendi sunucunda (PocketBase) kalır.
