services:
  finansapp:
    build: .
    image: finansapp-pro
    container_name: finansapp
    ports:
      - "8080:80"
    restart: unless-stopped

  # Bulut senkron için self-hosted backend (auth + veri). Veri ./pb/pb_data'da kalır.
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: finansapp-pb
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./pb/pb_data:/pb_data
      - ./pb/pb_migrations:/pb_migrations
      - ./pb/pb_hooks:/pb_hooks
    command:
      - serve
      - --http=0.0.0.0:8090
      - --dir=/pb_data
      - --migrationsDir=/pb_migrations
      - --hooksDir=/pb_hooks
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
