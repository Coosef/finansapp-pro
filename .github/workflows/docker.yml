name: Docker publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: finansapp-pro   # frontend (nginx + React)
            context: .
          - image: finansapp-pb    # PocketBase (hook + migration gömülü)
            context: ./pb
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: GHCR login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build identity: yalnız frontend (finansapp-pro) için exact git short SHA + tek zaman
      # damgası (bir kez hesaplanır → her iki platform aynı bundle). PB build'ine arg GÖNDERİLMEZ.
      - name: Frontend build args (yalnız finansapp-pro)
        id: fe
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          if [ "$IMAGE" = "finansapp-pro" ]; then
            {
              echo "args<<EOF"
              echo "BUILD_SHA=$(git rev-parse --short HEAD)"
              echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Meta (etiketler)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/coosef/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha,format=short

      - name: Build & push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ steps.fe.outputs.args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
