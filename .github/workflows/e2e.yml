name: Browser E2E

# Deterministik zincir: npm ci → unit/integration → production build →
# Playwright browser/runtime → izole PocketBase 0.39.10 → fixture seed →
# Vite preview → Playwright A–L. Unit veya build fail ederse browser aşamasına geçilmez
# (adımlar sıralı; ilk hatada job durur).

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Browser E2E          # branch protection için kararlı required-check adı
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"               # playwright.config: reuseExistingServer=false + preview-only webServer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps (npm ci)
        run: npm ci

      # --- Gating: unit/integration + build browser aşamasından ÖNCE ---
      - name: Unit/integration tests (vitest)
        run: npm test

      - name: Production build
        run: npm run build

      # --- Browser/runtime hazırlığı (pinned chromium + OS deps) ---
      - name: Playwright browser + runtime deps
        run: npx playwright install --with-deps chromium

      # --- Telegram T1C StrictMode DEV smoke (React.StrictMode çift-efekt davranışı) ---
      # AMAÇ: StrictMode kurulum→temizlik→kurulum probu YALNIZ development derlemesinde çalışır;
      # production-preview suite'i bu sınıf hatayı (mounted-ref ikinci kurulumda false kalırsa
      # async durum sonuçları sonsuza dek yok sayılır → kart kalıcı "yükleniyor") KANITLAYAMAZ.
      # Bu yüzden GERÇEK `vite dev` sunucusu + kendi izole throwaway PocketBase 0.39.10'u
      # (playwright.dev.config.js globalSetup/teardown, ana suite ile aynı desen) kullanılır.
      # Production erişimi YOK, retries=0, workers=1 (config). Fail ederse bu workflow düşer.
      # NOT: production-preview testine ÇEVRİLMEMELİ — amacı tam olarak development StrictMode.
      - name: Telegram T1C StrictMode dev smoke
        run: npm run test:e2e:dev

      # --- İzole PB 0.39.10 (globalSetup docker) + fixture seed + preview + tüm suite ---
      # PocketBase E2E sürümü globalSetup içinde 0.39.10'a PIN'li (asla :latest).
      # AI (senaryo L) gerçek /pb/ai endpoint'ini page.route() ile mock eder → gerçek
      # AI credential / dış servis GEREKMEZ. Throwaway PB + fixture user; production yok.
      # Filtre YOK → tüm spec'ler: A–L + N1–N4 + P1–P9 + CAS C1–C8 + M1(sync buton) + compat/enforce.
      - name: "Browser E2E full suite (A–L + N + P + CAS + M1–M3 + compat)"
        run: npx playwright test --workers=1 --retries=0

      # --- Persistence race gate: P1–P9 suite'i 3× ardışık (retries=0) → yarış kararlılığı ---
      - name: Persistence race gate (P1–P9 ×3)
        run: |
          for i in 1 2 3; do
            echo "== persistence race gate run $i/3 =="
            npx playwright test e2e/p-persistence.spec.mjs --workers=1 --retries=0
          done

      # --- CAS + çakışma race gate: C1–C8 + M1/M2/M3 (conflict surface) 3× ardışık → kararlılık ---
      - name: CAS + conflict race gate (C1–C8 + M1–M3 ×3)
        run: |
          for i in 1 2 3; do
            echo "== CAS+conflict race gate run $i/3 =="
            npx playwright test e2e/c-cas-hardening.spec.mjs e2e/c2-cas.spec.mjs e2e/c3-cas.spec.mjs e2e/m1-sync-button.spec.mjs e2e/m2-m3-samefield-conflict.spec.mjs --workers=1 --retries=0
          done

      # --- REAL-PWA E2E: GERÇEK service worker (serviceWorkers:"allow") ile sync-correctness ---
      # Ayrı config (playwright.pwa.config.js, *.pwa.mjs); normal suite (serviceWorkers:"block")
      # DEĞİŞMEZ. 3× ardışık (determinizm). İnvariant: geçerli server ACK yoksa "Kaydedildi" YOK,
      # WAL korunur, PB değişmez; /pb asla SW-cache'ten servis edilmez. Aynı izole PB 0.39.10
      # (globalSetup docker) + preview (dist zaten build edildi). Production yok.
      - name: "REAL-PWA E2E (PW1–PW12 + trigger ×3)"
        run: |
          for i in 1 2 3; do
            echo "== PWA suite run $i/3 =="
            npx playwright test --config=playwright.pwa.config.js --workers=1 --retries=0
          done

      # --- Telegram T1A internal security API E2E (TG-A01–A34) ---
      # Ayrı config (playwright.tg.config.js, *.tg.mjs); browser YOK — PB endpoint'lerine
      # HMAC ile doğrudan fetch. İzole throwaway PB (TG secret'ları runtime-random). 3× determinizm.
      - name: "Telegram T1A E2E (TG-A01–A34 ×3)"
        run: |
          for i in 1 2 3; do
            echo "== TG suite run $i/3 =="
            npx playwright test --config=playwright.tg.config.js --workers=1 --retries=0
          done

      # --- Telegram AI T2B PB servis sözleşmesi E2E ---
      # Ayrı config (playwright.t2b.config.js, *.t2b.mjs); browser YOK. İzole throwaway PB +
      # host'ta FAKE AI upstream (gerçek sağlayıcı anahtarı GEREKMEZ). 3× determinizm.
      - name: "Telegram AI T2B E2E (AI-T2-* ×3)"
        run: |
          for i in 1 2 3; do
            echo "== T2B suite run $i/3 =="
            npx playwright test --config=playwright.t2b.config.js --workers=1 --retries=0
          done

      # --- ai_keys şema onarımı: GERÇEK yükseltme testi (temiz DB'den DEĞİL) ---
      # PRE-REPAIR (bozuk 1735000200 davranışı + yetim satırlar) durumundan başlar, AYNI veri
      # dizininde tam migration setiyle yeniden başlatıp onarımı kanıtlar.
      - name: "ai_keys upgrade repair test (UPG-01..08)"
        run: npm run test:pb:upgrade

      # --- Failure artifacts: test fail etse de çalışır (if: always) ---
      # HTML report + trace.zip (console + network dahil) + screenshot + video.
      # trace/video "retain-on-failure" olduğundan başarılı run'larda devasa artifact üretilmez.
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            playwright-report-pwa/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
